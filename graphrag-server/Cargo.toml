[package]
name = "graphrag-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "REST API server for GraphRAG"
keywords = ["graphrag", "server", "api", "rest"]
categories = ["web-programming::http-server"]
publish = false  # Not published to crates.io (internal use only)

[[bin]]
name = "graphrag-server"
path = "src/main.rs"

[features]
# Temporarily disabled auth feature (requires migration from Axum to Actix-web)
default = ["qdrant"] # , "auth"]
qdrant = ["qdrant-client"]
lancedb = ["dep:lancedb", "arrow-array", "arrow-schema"]
auth = ["jsonwebtoken", "bcrypt"]
ollama = ["ollama-rs"]
# OpenAI-compatible chat + embedding backends. Pulls in graphrag-core's
# matching feature; the embedding side here is reqwest-based and
# unconditional (reqwest is non-optional in this crate), so the gate is
# purely a code-path toggle, not a dependency one.
openai = ["graphrag-core/openai"]

[dependencies]
graphrag-core = { path = "../graphrag-core", features = ["caching", "lightrag", "pagerank", "memory-storage"] }

# mimalloc as the global allocator. The default Rust allocator (glibc
# malloc on Linux) retains free arenas indefinitely — for a long-running
# process that allocates large transient buffers (`master.clone()` of
# the in-memory KnowledgeGraph at each /api/graph/append cycle, ~200 MB
# each), RSS climbs monotonically. 2026-05-07: graphrag-server hit
# 88 GB anon-rss after 1h 13min uptime + 8 publish cycles → OOM-killed.
# mimalloc returns arenas to the OS aggressively and has a portable
# Rust crate with no autoconf-style native build dependencies (jemalloc
# was the first try but its autoconf probe of `strerror_r` returned
# the wrong type under glibc + the build's CFLAGS, blocking the build).
# See `memory/project_graphrag_oom_long_uptime.md`.
mimalloc = { version = "0.1", default-features = false }

# Optional: Ollama embeddings (requires main graphrag crate)
ollama-rs = { version = "0.2", optional = true }

# OpenAI-compat embedding backend (vLLM, OVMS, llama.cpp server, etc.).
# Always compiled — branch is gated by EmbeddingConfig.backend == "openai".
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Web framework - Actix-web + Apistos for OpenAPI documentation
actix-web = { workspace = true }
actix-cors = { workspace = true }
actix-rt = { workspace = true }
apistos = { workspace = true }
apistos-gen = { version = "0.6", features = [] }
schemars = { workspace = true }
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
sha2 = { workspace = true }

# Storage backends (optional)
qdrant-client = { workspace = true, optional = true }
lancedb = { workspace = true, optional = true }
arrow-array = { version = "56", optional = true }
arrow-schema = { version = "56", optional = true }

# Authentication (optional)
jsonwebtoken = { workspace = true, optional = true }
bcrypt = { workspace = true, optional = true }
thiserror = { workspace = true }
futures = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Async and concurrency
async-trait = { workspace = true }
parking_lot = { workspace = true }

# Caching and distributed systems
redis = { workspace = true }

# Lock-free Arc swap for hot-swapping the live EmbeddingService when
# /config POST rebuilds it. Read path is wait-free, which matters
# because every /api/query and /api/documents path grabs the embedder.
arc-swap = "1.7"

# Other
uuid = { workspace = true }
chrono = { workspace = true }

# Path-based ingestion (POST /api/documents with `path`/`paths`/`paths_glob`).
# `glob` expands user-supplied patterns server-side; the result is always
# re-canonicalized and re-checked against `INGEST_ALLOWED_ROOTS` before
# any byte is read, so glob expansion can never cross the sandbox.
glob = "0.3"

# Stale-context infrastructure (events sidecar + lease table + SSE).
# tokio-rusqlite pins the rusqlite Connection to a dedicated worker
# thread and exposes a `conn.call(|c| { ... })` async API — better fit
# than sqlx for our shape (single-process, single-file, ~100MB cap,
# embedded). Bundles SQLite via the `bundled` feature so we don't
# need the system libsqlite3.
tokio-rusqlite = { version = "0.6", features = ["bundled"] }
# rusqlite is pulled in transitively by tokio-rusqlite; declare it
# directly so we can name `rusqlite::Error`, `rusqlite::params_from_iter`,
# etc. directly. `bundled` feature must match tokio-rusqlite's so we
# only build SQLite once.
rusqlite = { version = "0.32", features = ["bundled"] }
# SSE responder for actix-web 4. By Rob Ede (actix-web maintainer);
# stable enough for production use, though pin the version because
# 0.x breaking changes are possible per the crate README.
actix-web-lab = "0.26"
# Unified-diff generation for event-log delta payloads. Server-side
# computes the diff at emit time, persists it; clients render it.
similar = "2.7"
